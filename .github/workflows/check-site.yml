# One-off check: what a fitpush share card looks like (two small previews as text). Results go to annotations.
name: Check site
on:
  push:
    paths: [".github/workflows/check-site.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Previews
        run: |
          pip install -q pillow
          cat > p.py <<'PY'
          import urllib.request, io, base64
          from PIL import Image
          for sl in ["zhim-nogami","tyaga-gorizontalnogo-bloka-uzkaya-rukoyatka"]:
              rq=urllib.request.Request(f"https://fitpush.ru/assets/exercises/share-cards-v2/{sl}.jpg",headers={"User-Agent":"Mozilla/5.0"})
              im=Image.open(io.BytesIO(urllib.request.urlopen(rq,timeout=30).read())).convert("RGB")
              im.thumbnail((420,420)); b=io.BytesIO(); im.save(b,"JPEG",quality=55); t=base64.b64encode(b.getvalue()).decode()
              for i in range(0,len(t),3500): print(f"::notice title={sl} {i//3500:02d}::{t[i:i+3500]}")
          PY
          python3 p.py
