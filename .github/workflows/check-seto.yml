# One-off check: which exercise sites may be shown inside the mini app (frame headers). Results go to annotations.
name: Check seto
on:
  push:
    paths: [".github/workflows/check-seto.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Telegram-iOS'
          for u in \
            "https://fitwill.app/ru/exercise/0253/chin-ups-narrow-parallel-grip/" \
            "https://fitwill.app/ru/exercises/" \
            "https://fitwill.app/ru/" \
            "https://www.jefit.com/exercises/1/barbell-bench-press" \
            "https://www.strengthlog.com/bench-press/" \
            "https://www.inbodybuilding.ru/" \
            "https://www.ironman.ru/" \
            "https://gymfit.pro/" ; do
            h=$(curl -sS -m 25 -L -A "$UA" -o body.html -D - "$u" || echo "curl failed")
            st=$(printf '%s' "$h" | grep -i '^HTTP/' | tail -1 | tr -d '\r')
            xfo=$(printf '%s' "$h" | grep -i '^x-frame-options' | tr -d '\r' | tr '\n' ' ')
            csp=$(printf '%s' "$h" | grep -i '^content-security-policy' | tr -d '\r' | grep -io 'frame-ancestors[^;]*' | tr '\n' ' ')
            title=$(grep -io '<title>[^<]*' body.html | head -1 | sed 's/<title>//I' | cut -c1-90)
            search=$(grep -io '\(name="[a-z_]*search[a-z_]*"\|name="q"\|[?&]\(q\|search\|s\)=[^"&]*\|action="[^"]*search[^"]*"\)' body.html | sort -u | head -5 | tr '\n' ' ')
            vid=$(grep -io '\(<video\|\.mp4\|youtube\.com/embed\|\.gif"\)' body.html | sort | uniq -c | tr '\n' ' ' | tr -s ' ')
            echo "::notice title=$u::status=[$st] xfo=[$xfo] fa=[$csp] title=[$title] search=[$search] media=[$vid]"
          done
