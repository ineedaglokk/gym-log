# Deploys the Telegram bot (bot/worker.js) to Cloudflare Workers and points the bot's webhook at it.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN.
name: Deploy bot
on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  workflow_dispatch:
concurrency: bot-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check secrets
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing
      - name: KV namespace
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100" | jq -r '.result[] | select(.title=="shlepa-bot") | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"shlepa-bot"}' "$api" | jq -r '.result.id')
          fi
          test -n "$id" && test "$id" != "null"
          sed "s/__KV_ID__/$id/" bot/wrangler.toml.tpl > bot/wrangler.toml
      - name: Deploy worker
        working-directory: bot
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@3 secret put BOT_TOKEN
      - name: Connect Telegram
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then echo "::error::Open Workers & Pages in the Cloudflare dashboard once to create a workers.dev subdomain"; exit 1; fi
          url="https://shlepa-bot.$sub.workers.dev"
          secret=$(printf '%s' "shlepa-hook:$BOT_TOKEN" | sha256sum | cut -c1-48)
          curl -fsS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" -H "Content-Type: application/json" \
            -d "{\"url\":\"$url/tg\",\"secret_token\":\"$secret\",\"allowed_updates\":[\"message\",\"callback_query\"],\"drop_pending_updates\":true}" | jq -c '{ok,description}'
          curl -fsS "https://api.telegram.org/bot$BOT_TOKEN/setMyCommands" -H "Content-Type: application/json" \
            -d '{"commands":[{"command":"start","description":"Открыть качалку и познакомиться"},{"command":"fun","description":"Прикол от Шлёпы"}]}' | jq -c '{ok}'
          sleep 3
          curl -fsS "$url/" ; echo
          echo "Worker: $url"
          echo "::notice title=Worker URL::$url"
          echo "Bot worker: $url" >> "$GITHUB_STEP_SUMMARY"
