# One-off check: which pictures and videos a fitpush exercise page shows. Results go to annotations.
name: Check site
on:
  push:
    paths: [".github/workflows/check-site.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Media on pages
        run: |
          cat > m.py <<'PY'
          import urllib.request, re
          for sl in ["zhim-nogami","tyaga-gorizontalnogo-bloka-uzkaya-rukoyatka","krab-s-rezinkoy","planka"]:
              rq=urllib.request.Request(f"https://fitpush.ru/exercises/{sl}/",headers={"User-Agent":"Mozilla/5.0"})
              h=urllib.request.urlopen(rq,timeout=30).read().decode("utf-8","ignore")
              imgs=sorted(set(re.findall(r'<img[^>]+src="([^"]+)"',h)))
              vids=sorted(set(re.findall(r'<(?:video|source)[^>]+src="([^"]+)"',h)+re.findall(r'(https?://[^"\']+\.(?:mp4|webm|gif))',h)))
              yt=sorted(set(re.findall(r'(youtube(?:-nocookie)?\.com/embed/[\w-]+|youtu\.be/[\w-]+|rutube\.ru/[\w/-]+|vk\.com/video[\w-]+)',h)))
              print(f"::notice title={sl}::imgs={[i for i in imgs if 'logo' not in i.lower()][:12]} | video={vids[:6]} | embeds={yt[:4]}")
          PY
          python3 m.py
