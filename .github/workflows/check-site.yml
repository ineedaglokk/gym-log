# One-off check: may fitpush share-card images be shown on another site (headers)? Results go to annotations.
name: Check site
on:
  push:
    paths: [".github/workflows/check-site.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          u="https://fitpush.ru/assets/exercises/share-cards-v2/zhim-nogami.jpg"
          a=$(curl -sS -o /dev/null -D - -H "Referer: https://ineedaglokk.github.io/gym-log/" -H "Sec-Fetch-Dest: image" -H "Sec-Fetch-Site: cross-site" "$u" | tr -d '\r' | grep -i '^\(HTTP/\|cross-origin\|content-type\|cache-control\|access-control\|content-security\|x-frame\|etag\)' | tr '\n' ' ')
          b=$(curl -sS -o /dev/null -w '%{http_code}' -H "Referer: https://example.com/" "$u")
          echo "::notice title=headers::$a | with a foreign referer: $b"
