# One-off check: which URL parameters fitpush.ru's catalog script reads. Results go to annotations.
name: Check site
on:
  push:
    paths: [".github/workflows/check-site.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        run: |
          note(){ echo "::notice title=$1::$(printf '%s' "$2" | tr '\n' ' ' | tr -s ' ' | cut -c1-3900)"; }
          curl -sS -m 30 -o c.js "https://fitpush.ru/assets/exercises/catalog-funnel.js?v=exercise-catalog-funnel-v9-remove-useful-guides"
          note "size" "$(wc -c < c.js)"
          note "around params.get(kind)" "$(grep -o '.\{0,900\}params\.get(kind).\{0,700\}' c.js | head -1)"
          note "search handling" "$(grep -o '.\{0,300\}search\.\(value\|addEventListener\).\{0,500\}' c.js | head -2)"
          note "kinds" "$(grep -o '.\{0,200\}\(\"q\"\|'"'"'q'"'"'\|\"search\"\|'"'"'search'"'"'\|\"muscle\"\|\"equipment\"\|\"place\"\).\{0,200\}' c.js | head -4)"
          note "replaceState" "$(grep -o '.\{0,300\}\(replaceState\|pushState\).\{0,300\}' c.js | head -2)"
